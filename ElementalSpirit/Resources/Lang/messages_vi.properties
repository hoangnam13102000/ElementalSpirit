# --- Pre-Boss Dialogue: Gặp Gorgon ---
boss.pre.l1.caption=Rừng Sâu - Hang Của Gorgon
boss.pre.l2.text=Arin bước vào khu rừng sâu nhất, nơi không khí trở nên lạnh lẽo và u ám. Bóng tối bao trùm mọi thứ, và một tiếng cười khẩy vang lên từ bóng đêm.
boss.pre.l3.text=Kahahaha! Một con sâu nhỏ lại dám bước vào lãnh địa của ta? Ngươi nghĩ mình có thể cứu được tinh linh đất ư? Đồ ngốc!
boss.pre.l4.text=Gorgon! Ta đã tìm đến đây. Thả tinh linh Terra ra, hoặc ta sẽ buộc ngươi phải làm vậy!
boss.pre.l5.text=Ngươi? Buộc ta? Hãy nhìn xem kẻ ngốc! Terra hiện đang bị giam cầm trong hòn đá ngươi thấy đấy. Năng lượng của nó đang được ta hấp thụ từng ngày!
boss.pre.l6.text=Arin... hãy cẩn thận... sức mạnh của nó rất lớn... nó đã hấp thụ phần lớn năng lượng đất...
boss.pre.l7.text=Đừng nói thế Terra! Ta sẽ giải cứu ngươi! Dù Gorgon có mạnh đến đâu, ta cũng sẽ đánh bại nó!
boss.pre.l8.text=Lời nói ngu ngốc! Hãy nếm trải nỗi đau tuyệt vọng đi! Ta sẽ nghiền nát ngươi và hấp thụ cả năng lượng của ngươi nữa!
boss.pre.l9.text=Thế thì hãy đến đây! Vì Terra, vì ngôi làng, và vì sự cân bằng của thế giới - ta sẽ đánh bại ngươi!
boss.pre.l10.caption= TRẬN ĐẤU BẮT ĐẦU 

# --- Post-Boss Dialogue: Gorgon Bị Đánh Bại ---
boss.post.l1.text=Với đòn đánh cuối cùng, Gorgon gục ngã. Thân thể quái vật bắt đầu tan biến thành những mảng bóng tối bay tứ tung.
boss.post.l2.text=Không... không thể nào... ta là bất tử... ta là... Gorgon...
boss.post.l3.text=Bóng tối tan biến hoàn toàn. Ánh sáng vàng ấm áp bắt đầu tỏa ra từ hòn đá bị phong ấn ở giữa sân đấu.
boss.post.l4.caption= PHONG ẤN ĐƯỢC GIAI NHẪN 
boss.post.l5.text=Arin... ngươi đã làm được... ngươi thực sự đã đánh bại nó...
boss.post.l6.text=Terra! Ngươi ổn chứ? Ta đã hứa sẽ giải cứu ngươi, và ta đã làm được!
boss.post.l7.text=Cảm ơn ngươi, người hùng trẻ tuổi. Ngươi đã giải cứu không chỉ ta, mà còn cả vùng đất này. Sức mạnh của đất đai sẽ được phục hồi.
boss.post.l8.text=Đây là những gì ta phải làm. Ngươi đã giúp ta rất nhiều trong cuộc hành trình này.
boss.post.l9.text=Như một lời cảm ơn, hãy nhận lấy phần năng lượng của ta. Khiên bảo vệ của ta sẽ trở nên mạnh mẽ hơn bao giờ hết. Từ nay, ta sẽ luôn ở bên cạnh ngươi, Arin.
boss.post.l10.text=Một luồng ánh sáng vàng ấm áp chảy từ tinh linh vào trong người Arin. Anh cảm thấy sức mạnh mới tràn đầy cơ thể, và mối liên kết giữa hai người càng trở nên bền chặt.
boss.post.l11.caption= TINH LINH ĐẤT ĐƯỢC GIẢI CỨU 

# --- Spirit Rescue: Terra Trao Quyền Năng ---
boss.rescue.l1.text=Arin, mối liên kết của chúng ta giờ đây đã được củng cố. Khiên bảo vệ của ta sẽ che chở ngươi khỏi mọi đòn đánh. Hãy sử dụng sức mạnh này một cách khôn ngoan.
boss.rescue.l2.text=Ta sẽ không bao giờ lãng phí món quà này, Terra. Chúng ta sẽ cùng nhau giải cứu ba tinh linh còn lại và khôi phục sự cân bằng cho thế giới.
boss.rescue.l3.text=Đúng vậy! Hành trình của chúng ta mới chỉ bắt đầu. Hãy tiến về phía trước, Arin - người hùng được bầu chọn!
boss.rescue.l4.caption= KHIÊN BẢO VỆ ĐẠT ĐẠO MỨC MỚI 
boss.rescue.l5.text=Với tinh linh đất Terra được giải cứu, Arin cảm thấy tự tin hơn bao giờ hết. Nhưng cuộc hành trình chưa kết thúc - ba tinh linh còn lại vẫn đang bị giam cầm bởi những thế lực bóng tối khác. Bước tiếp theo sẽ là tìm đến nơi ở của tinh linh lửa...

