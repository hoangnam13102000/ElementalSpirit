# -- Cảnh 1: Khởi Nguyên --
intro.s1.l1.caption=Từ rất lâu trước loài người...
intro.s1.l2.text=Từ rất lâu trước khi viên đá đầu tiên của nền văn minh được đặt xuống, trước khi các vị vua vẽ nên biên giới trên bản đồ, trước khi phép thuật trở thành một môn học được nghiên cứu trong các tòa tháp... một thế giới đã ra đời từ sự hòa hợp của bốn nguyên tố.
intro.s1.l2.caption=Đây là Elaria.
intro.s1.l3.text=Một thế giới của những khu rừng cổ xưa và đại dương vô tận, của những ngọn núi lửa âm ỉ và những cơn gió mang theo tiếng hát vượt qua các lục địa.

# -- Cảnh 2: Bốn Tinh Linh --
intro.s2.l1.caption=Bốn vị tinh linh canh giữ Elaria.
intro.s2.l2.text=Họ không phải là những vị thần đòi hỏi sự tôn thờ. Họ cũng không phải là những vị vua đòi hỏi lòng trung thành. Họ chính là hơi thở của thế giới hiện hình — bốn Tinh Linh Nguyên Tố Cổ Đại, sinh ra từ chính bản chất của Elaria.
intro.s2.l3.text=Terra, người có đôi bàn tay tạo nên những ngọn núi.
intro.s2.l3.caption=Đất
intro.s2.l4.text=Aqua, người có những giọt nước mắt lấp đầy đại dương.
intro.s2.l4.caption=Nước
intro.s2.l5.text=Ignis, người có ngọn lửa sưởi ấm mặt đất lạnh giá.
intro.s2.l5.caption=Lửa
intro.s2.l6.text=Zephyr, người có những cơn gió mang sự sống đi khắp thế gian.
intro.s2.l6.caption=Gió
intro.s2.l7.text=Cùng nhau, họ dệt nên sự cân bằng — bốn nguyên tố trong sự hòa hợp vĩnh cửu.

# -- Cảnh 3: Sự Tha Hóa --
intro.s3.l1.caption=Sự cân bằng đã bị phá vỡ.
intro.s3.l2.text=Một đêm nọ, không một lời báo trước... Biểu Tượng đã rạn nứt.
intro.s3.l3.text=Các tinh linh biến mất. Sức mạnh của họ, không còn được dẫn dắt, bắt đầu làm tha hóa thế giới.
intro.s3.l4.caption=Một thứ gì đó... đã thức tỉnh.
intro.s3.l5.text=Những khu rừng trở nên hung dữ. Những dòng sông gầm thét dữ dội. Núi lửa thức giấc. Và những sinh vật bóng tối xuất hiện từ sự tha hóa.
intro.s3.l6.text=Không ai biết chuyện gì đã xảy ra. Các tinh linh chỉ đơn giản là... biến mất.

# -- Cảnh 4: Arin --
intro.s4.l1.caption=Arin — Học Việc Pháp Sư Nguyên Tố
intro.s4.l2.text=Arin, vào trong đi con. Khu rừng đêm nay... không yên bình đâu.
intro.s4.l3.text=Trưởng lão... con nghe thấy gì đó. Một giọng nói. Từ sâu trong những tán cây.
intro.s4.l4.text=Chỉ là tiếng gió thôi, con à. Về nhà đi.
intro.s4.l5.text=Không... đó là ai đó. Đang cầu cứu.
intro.s4.l6.caption=Sợi Dây Liên Kết Tinh Linh thức tỉnh...

# -- Cảnh 5: Vị Tinh Linh Đầu Tiên --
intro.s5.l1.caption=Terra — Tinh Linh Đất
intro.s5.l2.text=Pháp sư trẻ... con nghe thấy ta.
intro.s5.l3.text=Ngươi là ai? Ta đang ở đâu?
intro.s5.l4.text=Ta là Terra. Và đây... là tất cả những gì còn lại của ta.
intro.s5.l5.text=Ngươi bị thương. Chuyện gì đã xảy ra?
intro.s5.l6.text=Một thứ gì đó cổ xưa hơn cả ký ức đã chia cắt chúng ta. Sức mạnh của chúng ta giờ đây đang đầu độc vùng đất này.
intro.s5.l7.text=Ta có thể giúp gì?
intro.s5.l8.text=Hãy vào Khu Rừng Đất. Tìm những mảnh tinh chất bị thất lạc của ta. Chứng minh giá trị của ngươi. Rồi... ta có thể cho ngươi mượn sức mạnh.
intro.s5.l9.text=Ta sẽ đến.
intro.s5.l10.text=Hãy cẩn thận. Sự thật... tăm tối hơn ngươi tưởng tượng nhiều. Và Đấng Nguyên Thủy—
intro.s5.l11.text=Nguyên Thủy? Đó là gì?
intro.s5.l12.text=...ngươi sẽ biết. Khi thời khắc đến.
intro.s5.l13.caption=Một điều gì đó đã bị giấu kín...

# -- Cảnh 6: Hành Trình Bắt Đầu --
intro.s6.l1.text=Bình minh ló rạng, nhợt nhạt và mông lung. Arin đứng ở rìa Khu Rừng Đất. Cây trượng trong tay. Và viên pha lê giờ đây phát ra ánh sáng xanh lục mờ nhạt.
intro.s6.l2.text=Con không nhất thiết phải làm điều này. Con vẫn còn quá trẻ.
intro.s6.l3.text=Con biết. Nhưng nếu không phải là con... thì sẽ là ai?
intro.s6.l4.text=Con không phải là người được chọn. Con chỉ đơn giản là... một người sẽ cố gắng.
intro.s6.l5.text=Và thế là bước chân đầu tiên đã được cất lên. Không phải bởi một vị anh hùng được tiên tri. Mà bởi một pháp sư trẻ không chịu quay lưng bỏ chạy.
intro.s6.l6.caption=Hành trình của bạn bắt đầu...
intro.s6.l7.text=ĐỊA ĐIỂM: Khu Rừng Đất\nMỤC TIÊU: Tìm ra nguồn gốc của sự tha hóa

