# --- Pre-Boss Dialogue: Gặp Gordor ---
boss.pre.l1.caption=Rừng Sâu - Hang Ổ Mãng Xà Gordor
boss.pre.l2.text={playerName} bước vào khu rừng sâu nhất, nơi không khí trở nên lạnh lẽo và u ám. Bóng tối bao trùm mọi thứ, và một tiếng cười khẩy vang lên từ bóng đêm.
boss.pre.l3.text=Kahahaha! Một con sâu nhỏ lại dám bước vào lãnh địa của ta? Ngươi nghĩ mình có thể cứu được tinh linh đất ư? Đồ ngốc!
boss.pre.l4.text=Gordor! Ta đã tìm đến đây. Thả tinh linh Terra ra, hoặc ta sẽ buộc ngươi phải làm vậy!
boss.pre.l5.text=Ngươi? Buộc ta? Hãy nhìn xem kẻ ngốc! Terra hiện đang bị giam cầm trong hòn đá ngươi thấy đấy. Năng lượng của nó đang được ta hấp thụ từng ngày!
boss.pre.l6.text={playerName}... hãy cẩn thận... sức mạnh của nó rất lớn... nó đã hấp thụ phần lớn năng lượng đất...
boss.pre.l7.text=Đừng nói thế Terra! Ta sẽ giải cứu ngươi! Dù Gordor có mạnh đến đâu, ta cũng sẽ đánh bại hắn!
boss.pre.l8.text=Lời nói ngu ngốc! Hãy nếm trải nỗi đau tuyệt vọng đi! Ta sẽ nghiền nát ngươi và hấp thụ cả năng lượng của ngươi nữa!
boss.pre.l9.text=Thế thì hãy đến đây! Vì Terra, vì ngôi làng, và vì sự cân bằng của thế giới - ta sẽ đánh bại ngươi!
boss.pre.l10.caption= TRẬN ĐẤU BẮT ĐẦU 

# --- Post-Boss Dialogue: Gordor Bị Đánh Bại ---
boss.post.l1.text=Với đòn đánh cuối cùng, Gordor gục ngã. Thân thể mãng xà bắt đầu tan biến thành những mảng bóng tối bay tứ tung.
boss.post.l2.text=Không... không thể nào... ta là bất tử... ta là... Gordor...
boss.post.l3.text=Bóng tối tan biến hoàn toàn. Ánh sáng vàng ấm áp bắt đầu tỏa ra từ hòn đá bị phong ấn ở giữa sân đấu.
boss.post.l4.caption= PHONG ẤN ĐƯỢC GIAI NHẪN 
boss.post.l5.text={playerName}... ngươi đã làm được... ngươi thực sự đã đánh bại nó...
boss.post.l6.text=Terra! Ngươi ổn chứ? Ta đã hứa sẽ giải cứu ngươi, và ta đã làm được!
boss.post.l7.text=Cảm ơn ngươi, người hùng trẻ tuổi. Ngươi đã giải cứu không chỉ ta, mà còn cả vùng đất này. Sức mạnh của đất đai sẽ được phục hồi.
boss.post.l8.text=Đây là những gì ta phải làm. Ngươi đã giúp ta rất nhiều trong cuộc hành trình này.
boss.post.l9.text=Như một lời cảm ơn, hãy nhận lấy phần năng lượng của ta. Khiên bảo vệ của ta sẽ trở nên mạnh mẽ hơn bao giờ hết. Từ nay, ta sẽ luôn ở bên cạnh ngươi, {playerName}.
boss.post.l10.text=Một luồng ánh sáng vàng ấm áp chảy từ tinh linh vào trong người {playerName}. Người cảm thấy sức mạnh mới tràn đầy cơ thể, và mối liên kết giữa hai người càng trở nên bền chặt.
boss.post.l11.caption= TINH LINH ĐẤT ĐƯỢC GIẢI CỨU 

# --- Spirit Rescue: Terra Trao Quyền Năng ---
boss.rescue.l1.text={playerName}, ta trao cho ngươi kỹ năng Waterfall. Hãy gọi sức mạnh của đất và nước để quét sạch kẻ thù.
boss.rescue.l2.text=Ta sẽ không bao giờ lãng phí món quà này, Terra. Chúng ta sẽ cùng nhau giải cứu ba tinh linh còn lại và khôi phục sự cân bằng cho thế giới.
boss.rescue.l3.text=Đúng vậy! Hành trình của chúng ta mới chỉ bắt đầu. Hãy tiến về phía trước, {playerName} - người hùng được bầu chọn!
boss.rescue.waterfallUnlocked=ĐÃ NHẬN KỸ NĂNG WATERFALL
boss.rescue.l5.text=Với tinh linh đất Terra được giải cứu, {playerName} cảm thấy tự tin hơn bao giờ hết. Nhưng cuộc hành trình chưa kết thúc - ba tinh linh còn lại vẫn đang bị giam cầm bởi những thế lực bóng tối khác. Bước tiếp theo sẽ là tìm đến nơi ở của tinh linh lửa...

