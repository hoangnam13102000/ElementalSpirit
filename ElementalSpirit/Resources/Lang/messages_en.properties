boss.dialogue.skip=Skip

boss.speaker.narrator=Narrator
boss.speaker.arin=Arin
boss.speaker.gorgon=Gorgon
boss.speaker.terra=Terra

# --- Pre-Boss Dialogue: Meeting Gorgon ---
boss.pre.l1.caption=Deep Forest - Gorgon's Lair
boss.pre.l2.text=Arin steps into the deepest part of the forest, where the air turns cold and gloomy. Darkness envelops everything, and a mocking laugh echoes from the shadows.
boss.pre.l3.text=Kahahaha! A tiny worm dares to enter my domain? You think you can save the Earth Spirit? Fool!
boss.pre.l4.text=Gorgon! I have come here. Release Terra the spirit, or I will make you do it!
boss.pre.l5.text=You? Make me? Look at you, fool! Terra is currently imprisoned in that stone you see. Its energy is being absorbed by me day by day!
boss.pre.l6.text=Arin... be careful... its power is immense... it has absorbed most of the earth's energy...
boss.pre.l7.text=Don't say that, Terra! I will rescue you! No matter how powerful Gorgon is, I will defeat it!
boss.pre.l8.text=Foolish words! Taste the pain of despair! I will crush you and absorb your energy too!
boss.pre.l9.text=Then come at me! For Terra, for the village, and for the balance of the world - I will defeat you!
boss.pre.l10.caption=⚔ BATTLE BEGINS ⚔

# --- Post-Boss Dialogue: Gorgon Defeated ---
boss.post.l1.text=With the final strike, Gorgon falls. The monster's body begins to dissolve into fragments of darkness scattering in all directions.
boss.post.l2.text=No... impossible... I am immortal... I am... Gorgon...
boss.post.l3.text=The darkness completely fades away. A warm golden light begins to radiate from the sealed stone in the center of the arena.
boss.post.l4.caption= SEAL BROKEN 
boss.post.l5.text=Arin... you did it... you actually defeated it...
boss.post.l6.text=Terra! Are you alright? I promised to rescue you, and I have done it!
boss.post.l7.text=Thank you, young hero. You have rescued not only me, but this entire land. The earth's power shall be restored.
boss.post.l8.text=This is what I must do. You have helped me so much on this journey.
boss.post.l9.text=As a token of gratitude, accept a portion of my power. My protective shield shall become stronger than ever before. From now on, I shall always be by your side, Arin.
boss.post.l10.text=A stream of warm golden light flows from the spirit into Arin's body. He feels new power filling his being, and the bond between them grows ever stronger.
boss.post.l11.caption= EARTH SPIRIT RESCUED 

# --- Spirit Rescue: Terra Grants Power ---
boss.rescue.l1.text=Arin, our bond has now been strengthened. My protective shield shall guard you from every blow. Use this power wisely.
boss.rescue.l2.text=I shall never waste this gift, Terra. Together we shall rescue the three remaining spirits and restore balance to the world.
boss.rescue.l3.text=Indeed! Our journey has only just begun. Forge ahead, Arin - the chosen hero!
boss.rescue.l4.caption= EARTH SHIELD REACHES NEW LEVEL 
boss.rescue.l5.text=With Terra the Earth Spirit rescued, Arin feels more confident than ever. But the journey is not over - the three remaining spirits are still imprisoned by other dark forces. The next step will be to find the dwelling of the Fire Spirit...

hud.stageTransition=Moving to the next area...