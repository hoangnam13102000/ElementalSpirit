# ==== Intro / Story ====
intro.windowTitle=Elemental Spirit - Intro
intro.hint.controls=SPACE / CLICK: Continue    TAB: Skip Scene    ESC: Skip Intro

speaker.arin=Arin
speaker.terra=Terra
speaker.villageElder=Village Elder

# -- Scene 1: The Beginning --
intro.s1.l1.caption=Long before mankind...
intro.s1.l2.text=Long before the first stone of civilization was laid, before kings drew borders on maps, before magic became a discipline studied in towers... a world was born from the harmony of four elements.
intro.s1.l2.caption=This was Elaria.
intro.s1.l3.text=A world of ancient forests and endless oceans, of smoldering volcanoes and winds that carried songs across continents.

# -- Scene 2: The Four Spirits --
intro.s2.l1.caption=Four spirits guarded Elaria.
intro.s2.l2.text=They were not gods who demanded worship. They were not kings who demanded loyalty. They were the world's own breath made manifest — four Ancient Elemental Spirits, born from the essence of Elaria itself.
intro.s2.l3.text=Terra, whose hands shaped the mountains.
intro.s2.l3.caption=Earth
intro.s2.l4.text=Aqua, whose tears filled the oceans.
intro.s2.l4.caption=Water
intro.s2.l5.text=Ignis, whose fire warmed the cold earth.
intro.s2.l5.caption=Fire
intro.s2.l6.text=Zephyr, whose winds carried life across the world.
intro.s2.l6.caption=Wind
intro.s2.l7.text=Together, they wove a balance — four elements in eternal harmony.

# -- Scene 3: The Corruption --
intro.s3.l1.caption=The balance was broken.
intro.s3.l2.text=One night, without warning... the Symbol cracked.
intro.s3.l3.text=The spirits vanished. Their power, no longer guided, began to corrupt the world.
intro.s3.l4.caption=Something... awakened.
intro.s3.l5.text=Forests grew hostile. Rivers raged. Volcanoes awakened. And shadow creatures emerged from the corruption.
intro.s3.l6.text=No one knew what happened. The spirits were simply... gone.

# -- Scene 4: Arin --
intro.s4.l1.caption=Arin — Elemental Mage Apprentice
intro.s4.l2.text=Arin, come inside. The forest tonight... it is not peaceful.
intro.s4.l3.text=Elder... I hear something. A voice. From deep within the trees.
intro.s4.l4.text=It is only the wind, child. Go home.
intro.s4.l5.text=No... it is someone. Asking for help.
intro.s4.l6.caption=The Spirit Bond awakens...

# -- Scene 5: The First Spirit --
intro.s5.l1.caption=Terra — Spirit of Earth
intro.s5.l2.text=Young mage... you hear me.
intro.s5.l3.text=Who are you? Where am I?
intro.s5.l4.text=I am Terra. And this... is all that remains of me.
intro.s5.l5.text=You are wounded. What happened?
intro.s5.l6.text=Something older than memory tore us apart. Our power now poisons this land.
intro.s5.l7.text=How can I help?
intro.s5.l8.text=Enter the Earth Forest. Find my scattered essence. Prove your worth. Then... I may lend you strength.
intro.s5.l9.text=I will come.
intro.s5.l10.text=Be careful. The truth... is darker than you imagine. And the Primordial—
intro.s5.l11.text=Primordial? What is that?
intro.s5.l12.text=...you will know. In time.
intro.s5.l13.caption=Something has been hidden...

# -- Scene 6: The Journey Begins --
intro.s6.l1.text=Dawn broke pale and uncertain. Arin stood at the edge of the Earth Forest. Staff in hand. And a crystal that now glowed with faint green light.
intro.s6.l2.text=You do not have to do this. You are still young.
intro.s6.l3.text=I know. But if not me... then who?
intro.s6.l4.text=I am no chosen one. I am just... someone who will try.
intro.s6.l5.text=And so the first step was taken. Not by a prophesied hero. But by a young mage who refused to look away.
intro.s6.l6.caption=Your journey begins...
intro.s6.l7.text=LOCATION: Earth Forest\nOBJECTIVE: Find the source of corruption

